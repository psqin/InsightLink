[project]
name = "insight-link-agent"
version = "0.1.0"
description = "Academic guidance agent for InsightLink"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.28,<0.8",
    "fastapi>=0.115",
    "fastmcp>=4.0",
    "httpx>=0.28",
    "langchain-openai>=1.3,<2",
    "langgraph>=1.2",
    "langgraph-checkpoint-mongodb>=0.5.1",
    "langsmith>=0.14.11,<0.15",
    "openai>=2.0",
    "pydantic-settings>=2.0",
    "pymongo>=4.8,<5",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_link_agent"]

