# 学业点评 Harness 配置。改评审标准不必修改 LangGraph 节点。
phases:
  - planning
  - executing
  - reviewing
  - result

rubrics:
  baseline: |
    1. 每项关于学生材料的事实必须能在本轮授权来源中定位。
    2. 区分原文事实、导师判断和待核实的问题，不编造完成情况。
    3. 没有评分量表时不得提出建议分数，也不得提交正式点评。
    4. 语言尊重学生，行动建议具体且可执行。
    5. 附件只解析到部分片段时，不把缺失片段说成原文件没有相关内容。
  material_types:
    1: |
      学习计划：核对目标、时间安排、可执行步骤与验收方式；缺项时提出补充建议。
    2: |
      进度汇报：区分已完成工作、尚未完成工作与下一步，不能把计划写成成果。
    3: |
      自我总结：区分自述与可核查证据，给出具体改进方向而非笼统表扬。
  suggestion_baseline: |
    1. 建议分数仅供导师参考，不是系统正式成绩；导师可修改或拒绝。
    2. 所有事实和评分理由必须来自本轮授权材料，不能按缺失附件推断学生未完成工作。
    3. 评分理由须解释各维度，避免只给一个数字；评语须尊重学生并提供可执行建议。
    4. 证据不足时说明限制并保守评分，不编造结果。
  scoring:
    1: |
      学习计划（满分 100）：目标明确 30、时间与步骤可执行 30、验收方式 25、风险与调整 15。
      对尚未到期的计划不按“已完成成果”评分。
    2: |
      进度汇报（满分 100）：已完成工作及证据 40、进展分析 25、问题与风险 15、后续行动 20。
      计划中的工作不能计入已完成项。
    3: |
      自我总结（满分 100）：经历与成果证据 40、反思分析 30、改进计划 20、表达清晰 10。
      自述与可核查证据分开评价。
